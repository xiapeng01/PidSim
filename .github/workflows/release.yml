name: Build and Release

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version once
        shell: pwsh
        run: |
          $base = [datetime]'2000-01-01'
          $now = Get-Date
          $days = ($now.Date - $base).Days
          $seconds = [math]::Floor((($now.Hour * 3600) + ($now.Minute * 60) + $now.Second) / 2)
          $version = "0.1.$days.$seconds"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Build version: $version"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install nsis failed' }

          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            "$env:ChocolateyInstall\bin\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $makensis) { throw 'makensis.exe not found after installing NSIS' }

          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "makensis: $makensis"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish PidSimulator.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

      - name: Read file version
        shell: pwsh
        run: |
          $info = Get-ChildItem -Path obj -Recurse -Filter 'PidSimulator.AssemblyInfo.cs' |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $info) { throw 'Generated AssemblyInfo.cs not found' }

          $content = Get-Content $info.FullName -Raw
          $version = [regex]::Match($content, 'AssemblyFileVersionAttribute\("([^"]+)"\)').Groups[1].Value
          if (-not $version) { throw 'AssemblyFileVersion not found in generated AssemblyInfo.cs' }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "File version: $version"

      - name: Build installer
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish'
          $icon = Join-Path $env:GITHUB_WORKSPACE 'Assets\app.ico'
          $setup = Join-Path $env:GITHUB_WORKSPACE "PidSimulator-${env:VERSION}-win-x64-setup.exe"
          & $env:MAKENSIS "/DVERSION=${env:VERSION}" "/DPUBLISH_DIR=$publishDir" "/DICON=$icon" "/DOUTPUT=$setup" "installer/PidSimulator.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }

          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }

          "ASSET=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Installer: $setup"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PidSimulator ${{ env.VERSION }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
